server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión de los artefactos estáticos.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cachea los assets con hash de forma agresiva.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy hacia la API Python (servicio `backend` en docker-compose).
    # Se usa el resolver de Docker (127.0.0.11) + variable para resolver el
    # upstream en tiempo de petición: así nginx arranca aunque el backend
    # todavía no exista (devolverá 502 hasta que esté levantado).
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Páginas públicas: sirve el HTML prerenderizado (SSG) si existe
    # (p. ej. /features -> /features/index.html); si no, cae al shell cliente.
    location / {
        try_files $uri $uri/ /index.csr.html;
    }
}
