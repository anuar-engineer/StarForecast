# Límites de peticiones por IP (contexto http: conf.d se incluye dentro de él).
# Login y cambio de contraseña: frena la fuerza bruta. Formulario de contacto:
# frena el spam. Resto de la API: solo un techo generoso contra abusos.
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=leads:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Caddy (host) termina el TLS y habla con nginx por HTTP: las redirecciones
    # propias van relativas para no apuntar a http://.
    absolute_redirect off;

    # IP real del visitante. Caddy, en el host, llega a través del puerto
    # publicado en 127.0.0.1, así que nginx ve la IP de la red de Docker; la del
    # cliente viene en X-Forwarded-For (Caddy la fija e ignora la que mande el
    # cliente). Sin esto, los límites por IP se aplicarían a todos a la vez.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;

    # Subida de CSV/Excel: el backend admite hasta 25 MB (más la cabecera multipart).
    client_max_body_size 26m;

    # Compresión de los artefactos estáticos.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json application/manifest+json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Archivos ocultos (p. ej. og/.manifest.json, la caché del generador de imágenes).
    location ~ /\. {
        return 404;
    }

    # JS, CSS y fuentes con hash en el nombre: cambian de nombre si cambian,
    # así que se pueden cachear un año.
    # (Entre comillas: las llaves de {8} romperían el parser de nginx.)
    location ~ "^/(?:(?:main|chunk|polyfills|styles)-[A-Z0-9]{8}\.(?:js|css)|media/.+)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Imágenes, favicons y manifest: sin hash (se regeneran con el mismo nombre),
    # así que caché de un día para que los cambios lleguen.
    location ~* \.(?:png|jpe?g|webp|gif|svg|ico|webmanifest)$ {
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Proxy hacia la API Python (servicio `backend` en docker-compose).
    # Se usa el resolver de Docker (127.0.0.11) + variable para resolver el
    # upstream en tiempo de petición: así nginx arranca aunque el backend
    # todavía no exista (devolverá 502 hasta que esté levantado).
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/api/auth/(?:login|password)$ {
        limit_req zone=auth burst=5 nodelay;
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/leads {
        limit_req zone=leads burst=3 nodelay;
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # La importación calcula las previsiones dentro de la petición: con
    # catálogos grandes tarda bastante más que el minuto por defecto.
    location = /api/imports {
        limit_req zone=api burst=40 nodelay;
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Zona autenticada: no se prerenderiza, siempre se sirve el shell cliente.
    location ~ ^/(app|login)(/|$) {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.csr.html;
    }

    # Páginas públicas: sirve el HTML prerenderizado (SSG) si existe
    # (p. ej. /features -> /features/index.html). Una URL sin HTML prerenderizado
    # no existe: responde 404 real (no un 200 "soft 404" que Google indexaría)
    # con el shell cliente como cuerpo, que redirige al usuario al inicio.
    # no-cache: el navegador revalida siempre, para que un despliegue se vea al momento.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /index.csr.html;
    location = /index.csr.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
