# Cabeceras de seguridad. Se incluyen en el server y en CADA location que use
# add_header: nginx no hereda los add_header del nivel superior en cuanto un
# location define los suyos. HSTS lo pone Caddy (es quien sirve el HTTPS).
#
# CSP: 'unsafe-inline' en scripts lo exige el script de hidratación/event replay
# que Angular incrusta en el HTML prerenderizado. Fuentes, imágenes y API son
# todas del propio dominio.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
